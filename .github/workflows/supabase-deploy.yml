name: Deploy Supabase

# Publica migrations e edge functions no projeto de produção a cada push na main
# que mexa em supabase/. O site é publicado pelo Easypanel, não por aqui.
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
    inputs:
      todas_functions:
        description: "Publicar todas as edge functions"
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lzdhrtcugqnqmyapgmbs
    steps:
      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versão fixa: atualizações da CLI já mudaram comandos e quebraram o deploy.
      # Para atualizar, troque aqui e rode o workflow manualmente para conferir.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Vincular projeto
        run: supabase link --project-ref "$PROJECT_REF"

      # db push recusa rodar se o banco tiver migration que não existe no repositório,
      # então um histórico divergente para o deploy em vez de reaplicar SQL.
      - name: Migrations
        run: |
          supabase migration list --remote
          supabase db push --remote --dry-run
          supabase db push --remote --yes

      - name: Edge functions
        env:
          EVENTO: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TODAS: ${{ inputs.todas_functions }}
        run: |
          todas=false
          alteradas=""
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            todas="$TODAS"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            todas=true
          else
            alteradas=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions supabase/config.toml)
            # código compartilhado ou configuração (verify_jwt) afetam todas as functions
            if echo "$alteradas" | grep -qE '^supabase/(functions/_shared/|config\.toml$)'; then
              todas=true
            fi
          fi

          if [ "$todas" = "true" ]; then
            echo "Publicando todas as edge functions"
            supabase functions deploy --remote="$PROJECT_REF" --yes
            exit 0
          fi

          fns=$(echo "$alteradas" | awk -F/ '$2 == "functions" && $3 != "" { print $3 }' | sort -u)
          if [ -z "$fns" ]; then
            echo "Nenhuma edge function alterada"
            exit 0
          fi
          for fn in $fns; do
            if [ -f "supabase/functions/$fn/index.ts" ]; then
              echo "Publicando $fn"
              supabase functions deploy "$fn" --remote="$PROJECT_REF" --yes
            fi
          done
